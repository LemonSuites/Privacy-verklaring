<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-mail bevestigd — Lemon Suites</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F7F6F2;
      font-family: Arial, Helvetica, sans-serif;
      color: #1C1C1C;
      padding: 24px;
    }
    .kaart {
      background: #FFFFFF;
      border: 1px solid #E5E3DC;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo .mark {
      background: #E8C832;
      color: #111111;
      font-weight: 700;
      width: 34px;
      height: 34px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    .logo .naam {
      font-family: Georgia, serif;
      font-size: 18px;
      font-weight: 600;
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { font-size: 15px; line-height: 1.6; color: #4A4A4A; margin: 0 0 8px; }
    .en { color: #8A8A8A; font-size: 14px; margin-top: 20px; }
    .vink {
      width: 56px; height: 56px; border-radius: 50%;
      background: #E8F5E9; color: #2E7D32;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; margin: 0 auto 20px;
    }
  </style>
</head>
<body>
  <div class="kaart">
    <div class="logo">
      <span class="mark">LS</span>
      <span class="naam">Lemon Suites</span>
    </div>
    <div class="vink">&#10003;</div>
    <h1>Je e-mailadres is bevestigd</h1>
    <p>Je account is nu actief. Ga terug naar de Lemon Suites-app en log in met je e-mailadres en wachtwoord.</p>
    <p class="en">Your email address has been confirmed. Return to the Lemon Suites app and log in with your email and password.</p>
  </div>
</body>
</html>
